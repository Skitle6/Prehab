<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Prehab</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Prehab">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#F2F4F7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0C1015" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-180.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Barlow:wght@400;500;600;700&display=swap">
<style>
/* Layout: one phone column, countdown header, sectioned checklists, fixed bottom tab bar */
:root{
  --bg:#F2F4F7; --surface:#FFFFFF; --ink:#12161C; --muted:#5B6573; --line:#DCE1E8;
  --accent:#1D5FD1; --accent-ink:#FFFFFF; --accent-soft:#E2EBFB; --done:#1E8A4B; --done-soft:#E1F3E8; --warn:#A8500B; --warn-soft:#FBEBDD;
  --display:"Barlow Condensed","Arial Narrow",system-ui,sans-serif;
  --body:"Barlow",system-ui,-apple-system,"Segoe UI",sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0C1015; --surface:#151B23; --ink:#E8ECF1; --muted:#8E99A8; --line:#253041;
  --accent:#6FA2FF; --accent-ink:#0C1015; --accent-soft:#17253C; --done:#4CC27E; --done-soft:#132A1E; --warn:#F0A15A; --warn-soft:#2C1D10; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0C1015; --surface:#151B23; --ink:#E8ECF1; --muted:#8E99A8; --line:#253041;
  --accent:#6FA2FF; --accent-ink:#0C1015; --accent-soft:#17253C; --done:#4CC27E; --done-soft:#132A1E; --warn:#F0A15A; --warn-soft:#2C1D10; color-scheme:dark}
*{box-sizing:border-box}
html{color-scheme:light;-webkit-text-size-adjust:100%}
body{margin:0;min-height:100vh;overscroll-behavior-y:none}
button,input,.row,.set,.cup,.chip,.tab{touch-action:manipulation}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.4;-webkit-tap-highlight-color:transparent}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
.wrap{max-width:560px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:calc(14px + env(safe-area-inset-top,0px)) calc(96px + env(safe-area-inset-bottom,0px))}
h1,h2,h3{font-family:var(--display);text-wrap:balance;margin:0;letter-spacing:.01em}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
button:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.eyebrow{font-size:12px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.muted{color:var(--muted)}
.num{font-variant-numeric:tabular-nums}

/* header */
.top{display:flex;align-items:center;gap:14px;padding-block:6px 14px}
.top .txt{flex:1;min-width:0}
.top h1{font-size:30px;line-height:1.05}
.count{font-family:var(--display);font-size:20px;color:var(--accent);margin-top:2px}
.ring{width:66px;height:66px;flex:none;position:relative}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring .pct{position:absolute;inset:0;display:grid;place-items:center;font-family:var(--display);font-size:19px}
.sync{font-size:12px;color:var(--muted);margin-top:2px}

/* week strip */
.week{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;margin-bottom:16px}
.wd{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:6px 0 7px;text-align:center}
.wd b{display:block;font-size:11px;font-weight:600;color:var(--muted);letter-spacing:.05em}
.wd span{display:block;font-family:var(--display);font-size:17px}
.wd i{display:block;height:4px;margin:4px 8px 0;border-radius:2px;background:var(--line);overflow:hidden}
.wd i em{display:block;height:100%;background:var(--done)}
.wd.today{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
.wd.surg{background:var(--warn-soft);border-color:var(--warn)}

/* sections + rows */
.sec{margin-bottom:18px}
.sec-h{display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin:0 2px 8px}
.sec-h h2{font-size:22px}
.list{background:var(--surface);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.row{display:flex;align-items:center;gap:12px;width:100%;text-align:left;padding:12px 14px;min-height:56px;border-top:1px solid var(--line)}
.row:first-child{border-top:0}
.box{width:26px;height:26px;flex:none;border-radius:8px;border:2px solid var(--line);display:grid;place-items:center;transition:background .15s,border-color .15s}
.box svg{width:16px;height:16px;opacity:0}
.row.on .box{background:var(--done);border-color:var(--done)}
.row.on .box svg{opacity:1}
.row .lbl{flex:1;min-width:0}
.row .lbl .t{font-weight:500}
.row.on .lbl .t{color:var(--muted);text-decoration:line-through;text-decoration-color:var(--line)}
.row .lbl .s{font-size:13px;color:var(--muted);margin-top:1px}
.time{font-family:var(--display);font-size:16px;color:var(--muted);width:44px;flex:none;text-align:right}
.gymrow{background:var(--accent-soft)}
.gymrow .t{font-weight:700!important}
.go{font-size:13px;font-weight:600;color:var(--accent);padding:6px 10px;border:1px solid var(--accent);border-radius:999px;flex:none}

.water{display:flex;align-items:center;gap:10px;padding:12px 14px;border-top:1px solid var(--line);flex-wrap:wrap}
.water .lbl{flex:1;min-width:120px}
.cups{display:flex;gap:5px}
.cup{width:24px;height:30px;border-radius:4px 4px 7px 7px;border:2px solid var(--accent);opacity:.45}
.cup.f{background:var(--accent);opacity:1}

.note{background:var(--warn-soft);border:1px solid var(--warn);color:var(--ink);border-radius:12px;padding:12px 14px;font-size:14px}
.note b{color:var(--warn)}
.note ul{margin:6px 0 0;padding-left:18px}
.note li{margin:2px 0}

/* workout tab */
.chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;margin-bottom:14px;scrollbar-width:none}
.chip{flex:none;padding:8px 12px;border-radius:999px;border:1px solid var(--line);background:var(--surface);font-weight:600;font-size:14px;text-align:center}
.chip small{display:block;font-weight:500;font-size:11px;color:var(--muted)}
.chip.sel{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.chip.sel small{color:var(--accent-ink);opacity:.8}
.chip.td{box-shadow:inset 0 0 0 2px var(--done)}
.whead{margin-bottom:14px}
.whead h2{font-size:34px;line-height:1}
.whead .meta{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
.pill{font-size:13px;font-weight:600;padding:4px 10px;border-radius:999px;background:var(--surface);border:1px solid var(--line)}
.pill.ok{background:var(--done-soft);border-color:var(--done);color:var(--done)}
.ex{padding:12px 14px;border-top:1px solid var(--line);display:grid;gap:8px}
.ex:first-child{border-top:0}
.ex-top{display:flex;gap:10px;align-items:baseline}
.ex-top .n{flex:1;min-width:0;font-weight:600}
.ex-top .r{font-family:var(--display);font-size:18px;color:var(--accent);flex:none}
.ex .tip{font-size:13px;color:var(--muted)}
.ex-bot{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.sets{display:flex;gap:7px;flex-wrap:wrap;flex:1}
.set{width:38px;height:38px;border-radius:50%;border:2px solid var(--line);font-family:var(--display);font-size:17px;color:var(--muted);display:grid;place-items:center}
.set.d{background:var(--done);border-color:var(--done);color:var(--surface)}
.wt{display:flex;align-items:center;gap:4px;font-size:13px;color:var(--muted)}
.wt input{width:64px;height:36px;border-radius:8px;border:1px solid var(--line);background:var(--bg);color:var(--ink);font:inherit;font-size:16px;text-align:center}
.ex.all .n{color:var(--done)}
.blk-note{font-size:13px;color:var(--muted);margin:-4px 2px 8px}
.btn{display:block;width:100%;padding:13px;border-radius:12px;border:1px solid var(--line);background:var(--surface);font-weight:600;color:var(--muted)}

/* tab bar */
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--surface);border-top:1px solid var(--line);
  display:grid;grid-template-columns:repeat(3,1fr);padding-bottom:env(safe-area-inset-bottom,0px);padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px)}
.tab{padding:10px 0 9px;display:grid;justify-items:center;gap:3px;font-size:12px;font-weight:600;color:var(--muted)}
.tab svg{width:24px;height:24px}
.tab.sel{color:var(--accent)}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
/* edit mode */
.editbtn{font-size:14px;font-weight:600;padding:8px 14px;border-radius:999px;border:1px solid var(--accent);color:var(--accent);flex:none}
.editbtn.on{background:var(--accent);color:var(--accent-ink)}
.ebar{background:var(--accent-soft);border:1px solid var(--accent);border-radius:12px;padding:10px 12px;font-size:14px;margin-bottom:14px}
.erow{display:grid;grid-template-columns:1fr auto;gap:8px;padding:10px 12px;border-top:1px solid var(--line);align-items:start}
.erow:first-child{border-top:0}
.efields{display:grid;gap:6px;min-width:0}
.efields .line{display:flex;gap:6px;min-width:0}
.ein{width:100%;min-width:0;height:38px;border-radius:8px;border:1px solid var(--line);background:var(--bg);color:var(--ink);font:inherit;font-size:16px;padding:0 10px}
.ein.sm{width:72px;flex:none;text-align:center;padding:0 4px}
.ein.sub{font-size:16px;color:var(--muted)}
.ectl{display:grid;grid-template-columns:repeat(3,34px);gap:4px}
.ectl button{height:34px;border-radius:8px;border:1px solid var(--line);background:var(--surface);font-size:15px;color:var(--muted);display:grid;place-items:center}
.ectl button.x{color:var(--warn);border-color:var(--warn)}
.add{display:block;width:100%;text-align:left;padding:12px 14px;border-top:1px solid var(--line);font-weight:600;color:var(--accent)}
.elab{font-size:12px;color:var(--muted);font-weight:600;letter-spacing:.04em;text-transform:uppercase}
.slot{padding:4px 0;font-weight:600;color:var(--accent)}
</style>
</head>
<body>

<div class="wrap" id="app"></div>
<nav class="tabs" id="tabs">
  <button class="tab" data-tab="today"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 11l3 3 8-8"/><path d="M20 12v7a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h9"/></svg>Today</button>
  <button class="tab" data-tab="lift"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 7v10M18 7v10M3 10v4M21 10v4M6 12h12"/></svg>Workout</button>
  <button class="tab" data-tab="prep"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="17" rx="2"/><path d="M16 2v4M8 2v4M3 10h18M9 15l2 2 4-4"/></svg>Surgery prep</button>
</nav>

<script>
(function(){
const SURGERY = new Date(2026,10,16); // Mon Nov 16 2026
const DAYS = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
const ORDER = [1,2,3,4,5,6,0];
const CHECK = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round" style="color:var(--surface)"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>';
const uid = () => 'x' + Date.now().toString(36) + Math.random().toString(36).slice(2,6);
const clone = o => JSON.parse(JSON.stringify(o));

/* ---------- default plan ---------- */
const slug = s => s.toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'');
const E = (n,s,r,tip,w) => ({n,s,r,tip:tip||'',w:!!w});
const prehab = () => ({t:'Knee prehab', note:'Do this first, every session. Hurt leg.', ex:[
  E('Quad sets',2,'10 × 5s','Tighten thigh, push back of knee flat into the bench, hold 5 sec'),
  E('Straight leg raise',3,'10','Lying on a bench. Lock the quad first, then lift. No bend at the knee'),
  E('Cable terminal knee extension',3,'15','Low pulley, strap or rope behind the hurt knee, face the stack. Push knee to fully straight and squeeze'),
  E('Heel slides',2,'15','Lying on a bench, slow, only as far as is comfortable'),
]});
const bike = (m, extra) => ({t:'Warm-up', ex:[E('Stationary bike, easy',1,m+' min','Seat high. If a full turn hurts, rock back and forth')].concat(extra||[])});
function defaultWorkouts(){
  const W = {
  1:{key:'push',name:'Push',focus:'Chest · Shoulders · Triceps',mins:60,blocks:[bike(6),prehab(),
    {t:'Lifts',note:'Rest 60–90 sec. Add weight when every set hits the top of the range.',ex:[
      E('Barbell bench press',4,'6–8','In the rack. Feet flat, no leg drive off the hurt leg',1),
      E('Incline DB press',3,'8–10','',1),
      E('Seated DB shoulder press',3,'8–10','Back on an upright bench, feet planted',1),
      E('Cable fly',3,'12','',1),
      E('Cable lateral raise',3,'15','',1),
      E('Rope pushdown',3,'12','',1),
      E('Overhead cable triceps extension',2,'12','',1)]},
    {t:'Core',ex:[E('Plank',3,'40 sec','On forearms and toes, knees off the floor')]}]},
  2:{key:'pull',name:'Pull',focus:'Back · Biceps · Rear delts',mins:60,blocks:[bike(6),prehab(),
    {t:'Lifts',note:'No pull-ups for now. Dropping off the bar onto that knee is the risk.',ex:[
      E('Seated cable pulldown',4,'8–10','Bench under the high pulley, wide bar or two handles',1),
      E('Seated cable row',4,'10','Bench or floor at the low pulley, knees soft',1),
      E('Chest-supported DB row',3,'10','Chest on an incline bench',1),
      E('Straight-arm cable pulldown',3,'12','',1),
      E('Face pull',3,'15','',1),
      E('Seated incline DB curl',3,'10','',1),
      E('Hammer curl',3,'12','',1)]},
    {t:'Core',ex:[E('Dead bug',3,'10 / side','Low back pressed down')]}]},
  3:{key:'lower',name:'Legs (knee-safe)',focus:'Hips · Hamstrings · Good leg',mins:55,blocks:[bike(8),prehab(),
    {t:'Lifts',note:'Training the good leg hard also helps the hurt one keep strength (cross-education). Nothing deep, nothing twisting.',ex:[
      E('Barbell hip thrust',4,'8–10','Upper back on a bench, pad on the bar, shins vertical',1),
      E('Single-leg leg press (good leg)',4,'8','',1),
      E('Hamstring curl',3,'12','Both legs, light, pain-free range',1),
      E('Single-leg quad extension (good leg)',3,'10','Same machine. Skip the hurt leg unless PT clears it',1),
      E('Cable straight-leg kickback (hurt leg)',3,'12','Ankle strap, stand on the good leg, hold the frame',1),
      E('Side-lying leg raise',3,'15 / side','On a bench or floor, top leg straight'),
      E('Seated DB calf raise',3,'15','Dumbbells resting on your thighs',1)]},
    {t:'Core',ex:[E('Cable Pallof press',3,'10 / side','Stand tall, weight even, no twisting'),E('Side plank',2,'30 sec / side','')]}]},
  4:{key:'upper',name:'Upper',focus:'Shoulders · Arms · Core',mins:60,blocks:[bike(6),prehab(),
    {t:'Lifts',ex:[
      E('Seated DB Arnold press',4,'8','',1),
      E('Bench press machine',3,'10','',1),
      E('Single-arm cable row',3,'10 / side','',1),
      E('Rear delt cable fly',3,'15','Or bent over on an incline bench with DBs',1),
      E('Cable bar curl',3,'10','',1),
      E('DB skull crusher',3,'10','Lying on a flat bench',1),
      E('Seated med ball chest pass',3,'10','Sit on a bench facing a wall, throw hard, catch')]},
    {t:'Core',ex:[E('Ab roller',3,'8–10','Pad under the knees. Skip if kneeling bothers the hurt knee, do a 45-sec plank instead'),E('Side plank',3,'30 sec / side','')]}]},
  5:{key:'full',name:'Full body',focus:'Strength day · heaviest of the week',mins:65,blocks:[bike(8),prehab(),
    {t:'Lifts',note:'Go heavier than earlier in the week, still with clean reps.',ex:[
      E('Barbell bench press',3,'5–6','',1),
      E('Seated cable pulldown',3,'8','',1),
      E('Barbell hip thrust',3,'8','',1),
      E('Single-leg leg press (good leg)',3,'10','',1),
      E('Seated DB shoulder press',3,'10','',1),
      E('Hamstring curl',3,'12','Light, pain-free',1)]},
    {t:'Core',ex:[E('Seated med ball twist',3,'12 / side','Feet flat on the floor, turn the shoulders, not the knees'),E('Ab roller',2,'8','Pad under the knees, skip if kneeling hurts')]}]},
  6:{key:'sat',name:'Bike + mobility',focus:'Light day · shorter',mins:35,light:1,blocks:[
    {t:'Cardio',ex:[E('Stationary bike, steady',1,'25 min','Easy enough that you could talk. Full turns if you can')]},prehab(),
    {t:'Mobility',ex:[E('Seated hamstring stretch',2,'30 sec / side','Leg straight on the bench'),E('Standing hip flexor stretch',2,'30 sec / side','Standing, not kneeling'),E('Calf stretch on wall',2,'30 sec / side','')]}]},
  0:{key:'sun',name:'Recovery',focus:'Rest day · keep the knee moving',mins:25,light:1,blocks:[
    {t:'Move',ex:[E('Walk',1,'15–20 min','Only if the knee feels calm. Flat ground')]},prehab(),
    {t:'Extension',ex:[E('Heel prop',2,'5 min','Heel on a rolled towel, let the knee hang straight. Goal: flat like the other one'),E('Ice + elevate',1,'15 min','Knee above heart')]}]},
  };
  for(const d in W){ for(const b of W[d].blocks){ b.ex = b.ex.map(e=>Object.assign({},e,{id:W[d].key+'-'+slug(e.n)})) } }
  return W;
}

const tm = m => { m=((m%1440)+1440)%1440; let h=Math.floor(m/60), mm=m%60; h = h%12||12; return h+':'+String(mm).padStart(2,'0') };
const at = (h,m) => h*60+m;
const I = (id,time,t,s) => ({id,time,t,s:s||''});
const GYM = time => ({id:'gym',time:time||'',gym:true});
function earlyAM(w, leave){ return {t:'Morning', items:[
  I('m-water',tm(w),'Up. Full glass of water'),
  I('m-knee',tm(w+2),'Wake-up knee','10 quad sets + 10 heel slides in bed'),
  I('m-shower',tm(w+5),'Shower','Wash face in there'),
  I('m-brush',tm(w+15),'Brush teeth','2 min + tongue'),
  I('m-skin',tm(w+18),'Deodorant + moisturizer with SPF'),
  I('m-fuel',tm(w+20),'Quick fuel for the lift','Banana + yogurt, or a shake. Eat it in the car if you have to'),
  I('m-leave',tm(leave),'Leave','Gym bag packed last night'),
  GYM('6:15'),
  I('m-bfast2','7:25','Real breakfast with protein','Within an hour of lifting'),
  I('m-class','8:25','Class'),
]}}
function schoolAM(){ const w=at(6,0); return {t:'Morning', items:[
  I('m-water',tm(w),'Up. Full glass of water'),
  I('m-knee',tm(w+2),'Wake-up knee','10 quad sets + 10 heel slides in bed'),
  I('m-shower',tm(w+5),'Shower','Wash face in there'),
  I('m-brush',tm(w+20),'Brush teeth','2 min + tongue'),
  I('m-skin',tm(w+23),'Deodorant + moisturizer with SPF'),
  I('m-bfast',tm(w+25),'Breakfast with protein','Eggs, Greek yogurt, or a shake'),
  I('m-bag',tm(w+50),'Grab gym bag','Shoes, water bottle, brace'),
  I('m-leave',tm(w+60),'Leave'),
]}}
function weekendAM(){ const w=at(8,0); return {t:'Morning', items:[
  I('m-water',tm(w),'Up. Full glass of water'),
  I('m-knee',tm(w+5),'Wake-up knee','10 quad sets + 10 heel slides in bed'),
  I('m-shower',tm(w+10),'Shower','Wash face in there'),
  I('m-brush',tm(w+25),'Brush teeth','2 min + tongue'),
  I('m-skin',tm(w+30),'Deodorant + moisturizer with SPF'),
  I('m-bfast',tm(w+35),'Breakfast with protein','Eggs, Greek yogurt, or a shake'),
]}}
const dayAfterAM = () => ({t:'Day', items:[
  I('d-lunch','','Lunch with protein'),
  I('d-ice','','Ice + elevate knee after school','15–20 min, knee above heart'),
  I('d-hw','','Homework block'),
  I('d-dinner','','Dinner','Protein, carbs, vegetables'),
]});
const dayGym = () => ({t:'Day', items:[
  I('d-lunch','','Lunch with protein'),
  I('d-snack','','Snack 60–90 min before gym','Fruit + protein'),
  GYM(),
  I('d-post','','Protein within an hour after','Shake or a real meal'),
  I('d-ice','','Ice + elevate knee','15–20 min, knee above heart'),
  I('d-hw','','Homework block'),
  I('d-dinner','','Dinner','Protein, carbs, vegetables'),
]});
const dayLight = () => ({t:'Day', items:[
  GYM(),
  I('d-lunch','','Lunch with protein'),
  I('d-ice','','Ice + elevate knee','15–20 min, knee above heart'),
  I('d-dinner','','Dinner','Protein, carbs, vegetables'),
]});
function nightPM(bed, wakeLabel, early){ return {t:'Night', badge: early?'Early night · up at '+wakeLabel:'', note:'Brush 30 min before strips, not right before, and nothing but water after.', items:[
  I('n-kitchen',tm(bed-90),'Kitchen closed', early?'Eat dinner before this. Water only from here':'Water only from here'),
  I('n-prop',tm(bed-85),'Heel prop','5 min, let the knee hang straight'),
  I('n-brush',tm(bed-75),'Floss + brush teeth'),

/* ---------- storage: local cache + private db ---------- */
const cache = {};
let col = null, syncState = 'local';
const blank = () => ({c:{},sets:{},wt:{},water:0,u:0});
function lsGet(k){ try{ const v=localStorage.getItem('prehab:'+k); return v?JSON.parse(v):null }catch(e){ return null } }
function lsSet(k,v){ try{ localStorage.setItem('prehab:'+k, JSON.stringify(v)) }catch(e){} }
function doc(k){ if(!cache[k]) cache[k] = lsGet(k) || blank(); return cache[k] }
let PLAN = (()=>{ const p=lsGet('plan'); return (p && p.plan && p.plan.v===PLAN_VERSION) ? p.plan : defaultPlan() })();
let planU = (()=>{ const p=lsGet('plan'); return (p && p.plan && p.plan.v===PLAN_VERSION) ? (p.u||0) : 0 })();
const timers = {};
function push(k, body){
  if(!col) return;
  clearTimeout(timers[k]);
  timers[k] = setTimeout(()=>{ col.doc(k).set(clone(body())).then(()=>setSync('synced')).catch(()=>setSync('offline')) }, 800);
}
function save(k){ const d=doc(k); d.u=Date.now(); lsSet(k,d); push(k, ()=>cache[k]) }
function savePlan(){ planU=Date.now(); const body={plan:PLAN,u:planU}; lsSet('plan',body); push('plan', ()=>({plan:PLAN,u:planU})) }
function setSync(s){ syncState=s; const el=document.getElementById('sync'); if(el) el.textContent=syncLabel() }
function syncLabel(){ return syncState==='synced'?'Saved to your account':syncState==='offline'?'Saved on this phone, will sync':'Saved on this phone' }
async function initRemote(){
  try{
    if(!window.claude || !window.claude.use) return;
    const [db,user] = await Promise.all([claude.use('db'), claude.use('user')]);
    if(!db || !user) return;
    const id = await user.id(); if(!id) return;
    col = db.collection('data/users/'+id);
    const keys = weekDates().map(iso).concat(['prep']);
    await Promise.all(keys.map(async k=>{
      const snap = await col.doc(k).get(); const local = doc(k);
      if(snap.exists){
        const r = clone(snap.data());
        if((r.u||0) >= (local.u||0)){ cache[k] = Object.assign(blank(), r); lsSet(k,cache[k]) } else save(k);
      } else if(local.u){ save(k) }
    }));
    const ps = await col.doc('plan').get();
    if(ps.exists){
      const r = clone(ps.data());
      if(r.plan && r.plan.v===PLAN_VERSION && (r.u||0) >= planU){ PLAN=r.plan; planU=r.u||0; lsSet('plan',r) }
      else if(planU) savePlan();
    } else if(planU) savePlan();
    setSync('synced'); if(!document.activeElement || !document.activeElement.matches('input')) render();
  }catch(e){ setSync('offline') }
}

function dayPct(date){
  const d=doc(iso(date)); let tot=0, on=0;
  R(date.getDay()).forEach(s=>s.items.forEach(it=>{ tot++; if(d.c[it.id]) on++ }));

const NEW = {

const app = document.getElementById('app');
app.addEventListener('click',e=>{

      const from=+b.dataset.from; let n=0;
      for(const g of [0,1,2,3,4,5,6]) if(g!==from && sameKind(g,from)){ PLAN.routine[g][0]=clone(PLAN.routine[from][0]); PLAN.routine[g][1]=clone(PLAN.routine[from][1]); n++ }
      savePlan(); b.textContent = n?`Copied to ${n} other day${n>1?'s':''}`:'No other days like this one'; return;
    }
    const list=getP(b.dataset.l), i=+b.dataset.i;
    if(act==='add') list.push(NEW[b.dataset.kind]());
    else if(act==='del') list.splice(i,1);

    else if(act==='down' && i<list.length-1) [list[i+1],list[i]]=[list[i],list[i+1]];
    savePlan(); render(); return;
  }

    else { b.dataset.armed=1; b.textContent='Tap again to reset all your edits'; b.style.color='var(--warn)' }

    const txt='PREHAB1:'+btoa(unescape(encodeURIComponent(JSON.stringify(all))));
    const msg=document.getElementById('bk-msg'), box=document.getElementById('restore-in');
    navigator.clipboard.writeText(txt).then(()=>{msg.textContent='Copied. Paste it in Notes to keep it.'}).catch(()=>{box.value=txt; box.select(); msg.textContent='Select all in the box above and copy it.'});
    return }

    const msg=document.getElementById('bk-msg'), v=(document.getElementById('restore-in').value||'').trim();
    try{ if(!v.startsWith('PREHAB1:')) throw 0; const all=JSON.parse(decodeURIComponent(escape(atob(v.slice(8)))));
      Object.keys(all).forEach(k=>{ if(k.startsWith('prehab:')) localStorage.setItem(k,all[k]) }); location.reload() }
    catch(_){ msg.textContent='That doesn\'t look like a Prehab backup. Copy the whole thing starting with PREHAB1:' }
    return }
  if(editing) return;
  if((b=q('[data-open]'))){ e.stopPropagation(); tab='lift'; viewDay=now0().getDay(); render(); window.scrollTo(0,0); return }
  if((b=q('[data-check]'))){ const id=b.dataset.check, key=tab==='prep'?'prep':k, d=doc(key); d.c[id]=!d.c[id]; save(key); render(); return }
  if((b=q('[data-water]'))){ const d=doc(k), i=+b.dataset.water; d.water=(d.water===i+1)?i:i+1; save(k); render(); return }
  if((b=q('[data-set]'))){ const d=doc(k), id=b.dataset.set, i=+b.dataset.i, cur=d.sets[id]||0; d.sets[id]=cur>i?i:i+1;
    const w=W(viewDay); if(viewDay===now0().getDay() && doneSets(w,d)===totalSets(w)) d.c.gym=true;
    save(k); render(); return }
  if((b=q('[data-reset]'))){ if(b.dataset.armed){ const d=doc(k); d.sets={}; save(k); render() } else { b.dataset.armed=1; b.textContent='Tap again to clear'; b.style.color='var(--warn)' } }
});
app.addEventListener('input',e=>{
  const t=e.target;
  if(t.dataset.wt){ const k=iso(now0()), d=doc(k); d.wt[t.dataset.wt]=t.value.slice(0,8); save(k); return }
  if(t.dataset.p){
    const p=t.dataset.p, last=p.split('.').pop();
    let v=t.value.slice(0,160);
    if(last==='s' && p.includes('.ex.')) v=Math.max(1,Math.min(10,parseInt(v,10)||1));
    if(last==='mins') v=parseInt(v,10)||0;
    if(p==='water') v=Math.max(1,Math.min(16,parseInt(v,10)||8));
    setP(p,v); savePlan();
  }
});
let lastDay=iso(now0());
document.addEventListener('visibilitychange',()=>{ if(!document.hidden && iso(now0())!==lastDay){ lastDay=iso(now0()); viewDay=now0().getDay(); if(!editing) render(); initRemote() } });

render();
initRemote();
})();
</script>

if('serviceWorker' in navigator){ window.addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{})) }
try{ navigator.storage && navigator.storage.persist && navigator.storage.persist() }catch(e){}
</script>
